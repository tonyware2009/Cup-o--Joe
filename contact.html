<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content=" Contact Cup o' Joe Coffee Company">
    <title>Contact Cup o' Joe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="brand-wrap">
            <img class="logo" src="Logo.png" alt="Cup o' Joe Coffee Company Logo">
            <div class="brand-text">
                <h1>Cup o' Joe</h1>
                <p>Fresh Coffee. Friendly People.</p>
            </div>
        </div>
    </header>

    <!-- Add Nav Tags Here-->
    
    <nav class="navigation" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html" aria-current="page">Contact</a>
    </nav>

    <main>
        <section class="hero contact-hero" aria-labelledby="contact-title">
            <div class="hero-content">
                <p class="eyebrow">Questions. Comments. Coffee Talk.</p>
                <h2 id="contact-title">Come Say Hello</h2>
                <p>We'd love to hear from you.</p>
             </div>
        </section>

        <section class="content contact-layout">
            <div class="contact-card">
                <h2>Contact Us</h2>
                <p>Have Questions? Send Cup o' Joe a message.</p>

                <form id="contactForm" action="#" method="post" novalidate>
                    <div class="form-group">
                        <label for="name"><span aria-hidden="true">Name *</span></label>
                        <input type="text" id="name" name="name" autocomplete="name" aria-describedby="nameError" required>
                        <span class="error-message" id="nameError"></span>
                    </div>
                
                    <div class="form-group">
                        <label for="email">Email <span aria-hidden="true">*</span></label>
                        <input type="email" id="email" name="email" autocomplete="email" aria-describedby="emailError" required>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="message">Message <span aria-hidden="true">*</span></label>
                        <textarea id="message" name="message" rows="6" aria-describedby="messageError" required></textarea>
                        <span class="error-message" id="messageError"></span>
                    </div>

                    <button type="submit">Check Message</button>
                    <p id="formFeedback" class="form-feedback" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Cup o' Joe Coffee Company</p>
        <p class="footer-tagline">Good Coffee, Brighter Days.</p>
    </footer>
</body>
</html>
